<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat RAG - Sistema RAG | Ing. Edeblangel Vanegas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">
    <nav class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between">
            <h1 class="text-xl font-bold">Sistema RAG - Chat</h1>
            <div>
                <a href="/admin" class="mr-4 hover:underline">Panel Admin</a>
                <button onclick="logout()" class="hover:underline">Cerrar Sesión</button>
            </div>
        </div>
    </nav>
    <div class="flex-1 flex overflow-hidden">
        <aside class="w-64 bg-white border-r border-gray-300 p-4">
            <h2 class="font-bold mb-4 text-gray-800">Historial</h2>
            <div id="history" class="space-y-2 text-sm text-gray-600">
                <p class="text-gray-400">Sin historial aún</p>
            </div>
        </aside>
        <main class="flex-1 flex flex-col">
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="bg-blue-100 p-4 rounded-lg max-w-3xl">
                    <p class="text-gray-800">¡Hola! Soy tu asistente RAG. Pregúntame sobre los documentos cargados.</p>
                </div>
            </div>
            <div class="border-t border-gray-300 p-4 bg-white">
                <div class="flex space-x-2 max-w-4xl mx-auto">
                    <input type="text" id="questionInput" placeholder="Escribe tu pregunta..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="sendBtn" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Enviar</button>
                </div>
                <footer class="mt-2 text-center text-xs text-gray-500">Sistema RAG - Autor: Ing. Edeblangel Vanegas</footer>
            </div>
        </main>
    </div>
    <script src="/static/js/chat.js"></script>
</body>
</html>
