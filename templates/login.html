<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema RAG | Ing. Edeblangel Vanegas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Sistema RAG</h1>
        <h2 class="text-lg text-center mb-6 text-gray-600">Iniciar Sesión</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700">Ingresar</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            ¿No tienes cuenta? <a href="/register" class="text-blue-600 hover:underline">Regístrate</a>
        </p>
        <footer class="mt-6 text-center text-xs text-gray-500">Sistema RAG - Autor: Ing. Edeblangel Vanegas</footer>
    </div>
    <script src="/static/js/login.js"></script>
</body>
</html>
