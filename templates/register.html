<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema RAG | Ing. Edeblangel Vanegas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center py-8">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Sistema RAG</h1>
        <h2 class="text-lg text-center mb-6 text-gray-600">Registro de Usuario</h2>
        <form id="registerForm" class="space-y-3">
            <input type="text" id="nombre" placeholder="Nombre" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <input type="text" id="apellidos" placeholder="Apellidos" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <input type="text" id="cedula" placeholder="Cédula" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <input type="email" id="email" placeholder="Email" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <input type="text" id="telefono" placeholder="Teléfono" class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <input type="password" id="password" placeholder="Contraseña" required class="w-full px-3 py-2 border border-gray-300 rounded-md">
            <select id="categoria" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                <option value="Usuario Estándar">Usuario Estándar</option>
                <option value="Investigador">Investigador</option>
                <option value="Administrador">Administrador</option>
            </select>
            <button type="submit" class="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700">Registrar</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">
            ¿Ya tienes cuenta? <a href="/login" class="text-blue-600 hover:underline">Inicia sesión</a>
        </p>
        <footer class="mt-6 text-center text-xs text-gray-500">Sistema RAG - Autor: Ing. Edeblangel Vanegas</footer>
    </div>
    <script src="/static/js/register.js"></script>
</body>
</html>
